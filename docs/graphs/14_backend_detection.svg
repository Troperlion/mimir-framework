<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Détection matériel au démarrage</title><desc id="desc">Diagramme vectoriel éditable généré depuis les dumps du framework.</desc>
<defs>
