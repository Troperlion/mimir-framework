name: Publish Wiki

on:
    push:
        branches: [main, develop]
        paths:
            - "docs/**"
            - ".github/workflows/wiki.yml"
    workflow_dispatch:

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and publish wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import os, re, shutil, subprocess, sys, pathlib

          REPO         = os.environ["REPO"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
          BRANCH       = os.environ.get("BRANCH", "develop")
          WIKI_URL    = f"https://x-access-token:{GITHUB_TOKEN}@github.com/{REPO}.wiki.git"
          DOCS_ROOT   = pathlib.Path("docs")
          WIKI_DIR    = pathlib.Path("/tmp/wiki")

          def strip_num(name: str) -> str:
              """Remove leading NN- numeric prefix from a filename or dir name."""
              return re.sub(r"^\d+-", "", name)

          def section_prefix(name: str) -> str:
              """Top-level docs section directory → wiki-safe prefix."""
              return strip_num(name).replace(" ", "-")

          def section_title(name: str) -> str:
              """Top-level docs section directory → human title for sidebar."""
              return strip_num(name).replace("-", " ")

          def section_sort_key(name: str):
              """Sort docs sections by numeric prefix when present, then lexicographically."""
              m = re.match(r"^(\d+)-", name)
              if m:
                  return (0, int(m.group(1)), name)
              return (1, 10_000, name)

          def wiki_page_name(rel: pathlib.PurePosixPath) -> str:
              """
              Convert a docs-relative path to a wiki page name (no extension).
              docs/00-INDEX.md           → Home
              docs/01-Getting-Started/01-Quick-Start.md → Getting-Started-01-Quick-Start

              The numeric prefix is kept in the filename portion so that files
              sharing the same human name (e.g. two Serialization pages) remain
              distinct wiki pages.
              """
              parts = list(rel.parts)
              if len(parts) == 1:
                  stem = pathlib.Path(parts[0]).stem
                  if parts[0] == "00-INDEX.md":
                      return "Home"
                  return strip_num(stem)

              # Support nested files under docs/<section>/... recursively.
              section_dir = parts[0]
              prefix = section_prefix(section_dir)

              tail_parts: list[str] = []
              for i, p in enumerate(parts[1:]):
                  is_last = (i == len(parts[1:]) - 1)
                  if is_last:
                      tail_parts.append(pathlib.Path(p).stem)
                  else:
                      tail_parts.append(strip_num(p).replace(" ", "-"))

              tail = "-".join([t for t in tail_parts if t])
              return f"{prefix}-{tail}" if tail else prefix

          def resolve_docs_asset(link: str, rel_doc_path: pathlib.PurePosixPath):
              """Resolve a local asset link to a docs-relative path when possible."""
              if (link.startswith("#")
                      or link.startswith("http://")
                      or link.startswith("https://")):
                  return None

              asset = link.split("#", 1)[0]
              if not asset:
                  return None

              try:
                  resolved = (DOCS_ROOT / rel_doc_path.parent / pathlib.PurePosixPath(asset)).resolve()
                  rel = resolved.relative_to(DOCS_ROOT.resolve())
                  return pathlib.PurePosixPath(rel.as_posix())
              except (ValueError, RuntimeError):
                  return None

          def copy_asset(asset_rel: pathlib.PurePosixPath):
              src = DOCS_ROOT / asset_rel
              dst = WIKI_DIR / asset_rel
              if not src.exists() or not src.is_file():
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          def fix_links(content: str, rel_doc_path: pathlib.PurePosixPath) -> str:
              """
              Rewrite markdown links so they point to wiki page names.
                - Relative .md links → wiki page name (no extension)
                - src/ links         → absolute GitHub source URL
                - External / anchor  → untouched
              """
              base_dir = rel_doc_path.parent

              def replace(m):
                  bang = m.group(1) or ""
                  text = m.group(2)
                  link = m.group(3)

                  # Leave anchors, external URLs, image extensions intact
                  if (link.startswith("#")
                          or link.startswith("http://")
                          or link.startswith("https://")):
                      return m.group(0)

                  if bang == "!":
                      asset_rel = resolve_docs_asset(link, rel_doc_path)
                      if asset_rel is not None:
                          copy_asset(asset_rel)
                          return f"![{text}]({asset_rel.as_posix()})"
                      return m.group(0)

                  # Separate path from optional #anchor fragment
                  anchor = ""
                  if "#" in link:
                      link, anchor = link.split("#", 1)
                      anchor = "#" + anchor

                  if not link:          # pure anchor like [text](#section)
                      return m.group(0)

                  path_obj = pathlib.PurePosixPath(link)

                  # Source-code links (relative paths ending outside docs/)
                  resolved = (base_dir / path_obj).as_posix()
                  # Normalise /../ etc.
                  try:
                      norm = pathlib.PurePosixPath(
                          pathlib.Path("/dummy/" + resolved).resolve().relative_to("/dummy")
                      )
                  except (ValueError, RuntimeError):
                      # Le chemin remonte au-dessus de docs/ (ex: ../src/ depuis 00-INDEX.md).
                      # On tente de résoudre depuis la racine du dépôt.
                      try:
                          repo_norm = pathlib.PurePosixPath(
                              pathlib.Path("/repo/docs/" + base_dir.as_posix() + "/" + path_obj.as_posix())
                              .resolve()
                              .relative_to("/repo")
                          )
                          repo_s = repo_norm.as_posix()
                          if (repo_s.startswith("src/")
                                  or repo_s.startswith("scripts/")
                                  or repo_s.startswith("Tests/")):
                              gh_url = f"https://github.com/{REPO}/blob/{BRANCH}/{repo_s}"
                              return f"[{text}]({gh_url}{anchor})"
                      except (ValueError, RuntimeError):
                          pass
                      return m.group(0)

                  norm_s = norm.as_posix()

                  # If the resolved path starts with "docs/" → wiki link
                  if norm_s.startswith("docs/"):
                      inner = pathlib.PurePosixPath(norm_s[len("docs/"):])
                      page  = wiki_page_name(inner)
                      return f"[{text}]({page}{anchor})"

                  # If the link is a plain relative path without docs/ prefix
                  # but ends in .md, check if it's relative to current section
                  if path_obj.suffix == ".md":
                      # Try to resolve relative to this file's dir inside docs
                      candidate = (DOCS_ROOT / base_dir / path_obj).resolve()
                      try:
                          inner = pathlib.PurePosixPath(
                              candidate.relative_to(DOCS_ROOT.resolve())
                          )
                          page = wiki_page_name(inner)
                          return f"[{text}]({page}{anchor})"
                      except ValueError:
                          pass

                  # Source code references (src/, scripts/, etc.) → absolute GitHub URL
                  if (norm_s.startswith("src/")
                          or norm_s.startswith("scripts/")
                          or norm_s.startswith("Tests/")):
                      gh_url = f"https://github.com/{REPO}/blob/{BRANCH}/{norm_s}"
                      return f"[{text}]({gh_url}{anchor})"

                  return m.group(0)

              return re.sub(r"(!?)\[([^\]]+)\]\(([^)]*)\)", replace, content)

          # ── Clone wiki ────────────────────────────────────────────────────────
          if WIKI_DIR.exists():
              shutil.rmtree(WIKI_DIR)
          result = subprocess.run(
              ["git", "clone", WIKI_URL, str(WIKI_DIR)],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print("Wiki repository not yet initialised — creating empty dir.")
              WIKI_DIR.mkdir(parents=True)
              subprocess.run(["git", "init"], cwd=WIKI_DIR, check=True)
              subprocess.run(
                  ["git", "remote", "add", "origin", WIKI_URL],
                  cwd=WIKI_DIR, check=True
              )

          # ── Remove old wiki pages (keep .git) ────────────────────────────────
          for f in WIKI_DIR.iterdir():
              if f.name != ".git":
                  f.unlink() if f.is_file() else shutil.rmtree(f)

          # ── Collect docs files automatically (recursive) ─────────────────────
          # (section_dir_or_None, rel_path_relative_to_docs)
          docs_files: list[tuple[str | None, pathlib.PurePosixPath]] = []

          all_md = sorted(
              [p for p in DOCS_ROOT.rglob("*.md") if p.is_file()],
              key=lambda p: p.relative_to(DOCS_ROOT).as_posix(),
          )

          # Ensure Home is first when docs/00-INDEX.md exists.
          home = DOCS_ROOT / "00-INDEX.md"
          if home.is_file():
              docs_files.append((None, pathlib.PurePosixPath("00-INDEX.md")))

          for md in all_md:
              rel = pathlib.PurePosixPath(md.relative_to(DOCS_ROOT).as_posix())
              if rel.as_posix() == "00-INDEX.md":
                  continue
              parts = rel.parts
              sec = parts[0] if len(parts) > 1 else None
              docs_files.append((sec, rel))

          # ── Copy files with link rewriting ────────────────────────────────────
          # sidebar_entries maps section dir → list of (wiki_page_name, human_display)
          SidebarEntry = tuple[str, str]
          sidebar_entries: dict[str, list[SidebarEntry]] = {}
          root_entries: list[SidebarEntry] = []
          asset_re = re.compile(r"!\[[^\]]*\]\(([^)]+)\)")
          copied_assets = set()

          for sec, rel in docs_files:
              page_name = wiki_page_name(rel)
              src = DOCS_ROOT / rel
              content = src.read_text(encoding="utf-8")
              content = fix_links(content, rel)
              (WIKI_DIR / f"{page_name}.md").write_text(content, encoding="utf-8")
              if sec is not None:
                  # Display keeps subpath context inside a section when nested.
                  rel_parts = list(rel.parts[1:])
                  display_parts: list[str] = []
                  for i, part in enumerate(rel_parts):
                      is_last = (i == len(rel_parts) - 1)
                      if is_last:
                          display_parts.append(strip_num(pathlib.Path(part).stem).replace("-", " "))
                      else:
                          display_parts.append(section_title(part))
                  display = " / ".join([d for d in display_parts if d]).strip()
                  sidebar_entries.setdefault(sec, []).append((page_name, display))
              elif rel.as_posix() != "00-INDEX.md":
                  display = strip_num(pathlib.Path(rel.name).stem).replace("-", " ")
                  root_entries.append((page_name, display))

              # Copy referenced assets for this page so wiki images resolve locally.
              for match in asset_re.finditer(content):
                  asset_rel = resolve_docs_asset(match.group(1), rel)
                  if asset_rel is None:
                      continue
                  if asset_rel.as_posix() in copied_assets:
                      continue
                  copied_assets.add(asset_rel.as_posix())
                  copy_asset(asset_rel)

          # ── Generate _Sidebar.md ──────────────────────────────────────────────
          sidebar_lines = ["## Navigation\n", "**[[Home]]**\n"]

          if root_entries:
              sidebar_lines.append("\n### General\n")
              for page_name, display in sorted(root_entries, key=lambda e: e[1].lower()):
                  sidebar_lines.append(f"- [[{display}|{page_name}]]\n")

          ordered_sections = sorted(sidebar_entries.keys(), key=section_sort_key)
          for sec in ordered_sections:
              entries = sidebar_entries.get(sec, [])
              if not entries:
                  continue
              title = section_title(sec)
              sidebar_lines.append(f"\n### {title}\n")
              for page_name, display in sorted(entries, key=lambda e: e[1].lower()):
                  sidebar_lines.append(f"- [[{display}|{page_name}]]\n")

          (WIKI_DIR / "_Sidebar.md").write_text("".join(sidebar_lines), encoding="utf-8")

          # ── Commit and push ───────────────────────────────────────────────────
          subprocess.run(
              ["git", "config", "user.name",  "github-actions[bot]"],
              cwd=WIKI_DIR, check=True
          )
          subprocess.run(
              ["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"],
              cwd=WIKI_DIR, check=True
          )
          subprocess.run(["git", "add", "-A"], cwd=WIKI_DIR, check=True)
          status = subprocess.run(
              ["git", "diff", "--staged", "--quiet"],
              cwd=WIKI_DIR
          )
          if status.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", "docs: sync wiki from docs/ [skip ci]"],
                  cwd=WIKI_DIR, check=True
              )
              subprocess.run(
                  ["git", "push", "origin", "HEAD"],
                  cwd=WIKI_DIR, check=True
              )
              print("Wiki updated successfully.")
          else:
              print("Wiki already up to date — nothing to push.")
          PYEOF
